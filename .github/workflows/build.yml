name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm64, goarm: "",   name: linux-arm64 }
          - { goarch: arm,   goarm: "7",  name: linux-armv7 }
          - { goarch: amd64, goarm: "",   name: linux-amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Resolve version
        id: ver
        run: echo "value=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.value }}" -o dist/sysinfo-${{ matrix.name }} .
      - uses: actions/upload-artifact@v4
        with:
          name: sysinfo-${{ matrix.name }}
          path: dist/sysinfo-${{ matrix.name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build all targets
        run: make release VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sysinfo-linux-arm64
            dist/sysinfo-linux-armv7
            dist/sysinfo-linux-amd64
            dist/SHA256SUMS
